name: Build

on:
  push:
    branches:
      - main
    # Also fire on version tags in N.N.N form (e.g. 0.0.1, 10.4.20 — each segment
    # may be multiple digits), including an optional -suffix pre-release, so
    # tagging a release builds the Release binaries and publishes a GitHub Release.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            artifact: photon-server-linux-x64
          - rid: linux-arm64
            artifact: photon-server-linux-arm64
          - rid: win-x64
            artifact: photon-server-win-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish photon-server.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            --output publish/${{ matrix.rid }}

      - name: Package
        run: |
          cd publish
          if [[ "${{ matrix.rid }}" == *win* ]]; then
            zip -j ${{ matrix.artifact }}.zip ${{ matrix.rid }}/*
          else
            tar -czf ${{ matrix.artifact }}.tar.gz -C ${{ matrix.rid }} .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            publish/*.tar.gz
            publish/*.zip

  # On a version tag, gather the per-RID artifacts built above and publish them
  # as a GitHub Release. Skipped for ordinary pushes to main (build only).
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Treat 0.x.y (initial development) and any -suffix tag as a pre-release.
          prerelease: ${{ startsWith(github.ref_name, '0.') || contains(github.ref_name, '-') }}
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
