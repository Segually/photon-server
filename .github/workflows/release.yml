name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            artifact: photon-server-linux-x64
          - rid: linux-arm64
            artifact: photon-server-linux-arm64
          - rid: win-x64
            artifact: photon-server-win-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish photon-server.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            --output publish/${{ matrix.rid }}

      - name: Package
        run: |
          cd publish
          if [[ "${{ matrix.rid }}" == *win* ]]; then
            zip -j ${{ matrix.artifact }}.zip ${{ matrix.rid }}/*
          else
            tar -czf ${{ matrix.artifact }}.tar.gz -C ${{ matrix.rid }} .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            publish/*.tar.gz
            publish/*.zip
